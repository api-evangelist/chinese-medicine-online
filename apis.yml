aid: chinese-medicine-online
name: Chinese Medicine Online
description: >-
  Chinese Medicine Online (中医在线) is a Beijing-based traditional Chinese medicine (TCM) continuing-education
  and academic-exchange platform, founded in 2015 and operated by Beijing Universe In Nutshell Technology Co., Ltd.
  (北京果壳宇宙教育科技有限公司) on behalf of the Beijing TCM Online Education Center (北京中医在线教育中心).
  Through its web platform at tcmmooc.com and its iOS/Android app, it publishes recorded and live video
  continuing-education courses from national TCM masters and senior practitioners, runs the 经方学社
  (Classical Formulas Society) learning community and 精医社 membership, livestreams academic conferences,
  and sells course material through a paid knowledge marketplace. The company states a catalogue of roughly
  19,600 courses from 3,900+ TCM experts and around 4 million registered users, the majority of them licensed
  practitioners. It has since extended into AI and SaaS for grassroots clinics, including the "Yi Yin" (伊尹)
  TCM classical-reasoning large language model launched in Songxian, Henan in September 2025, and clinic
  workflow tooling (prescription, patient and follow-up management). The platform is delivered strictly as an
  end-user web and mobile product — it publishes no public API, SDK, developer portal or machine-readable
  contract of any kind.

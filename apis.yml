  detail: >-
    中医在线 ships a TCM course web platform, an iOS/Android app and an AI/SaaS clinic product line, but
    its only backend route (http://www.tcmmooc.com/api) answers with a PHP "Whoops" error page, every
    spec and /.well-known/ path 404s on both tcmmooc.com and the corporate site tcmlive.com, and a POST
    to /mcp returns the same soft-404 error page as a nonsense control path — there is no developer
    portal, SDK, webhook surface or published contract anywhere on the company's public surface.
